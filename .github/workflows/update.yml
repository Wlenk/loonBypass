name: Update verified rules
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
concurrency:
  group: rules-update
  cancel-in-progress: false
jobs:
  update:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: alert-state
          key: alert-update-${{ github.run_id }}
          restore-keys: alert-update-
      - run: python scripts/build.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm test
      - run: npm ci --ignore-scripts
      - name: Publish an atomic Worker version
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Retain GitHub mirror and last verified manifest
        run: |
          git config user.name 'loon-rule-bot'
          git config user.email 'loon-rule-bot@users.noreply.github.com'
          git add public
          git commit -m 'Refresh verified Loon rules'
          git push
      - name: Verify published rules and notify recovery
        run: python scripts/monitor.py
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          BARK_URL: ${{ secrets.BARK_URL }}
      - name: Notify a failed update
        if: failure()
        run: python scripts/monitor.py --failure
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: alert-state
          key: alert-update-${{ github.run_id }}
